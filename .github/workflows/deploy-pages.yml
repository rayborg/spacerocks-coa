name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Install offline verifier dependency
        run: python3 -m pip install cryptography
      - name: Browser tests
        run: npm run test:e2e
      - name: Build
        run: npm run build
        env:
          VITE_TIMESTAMP_API_URL: https://timestamp-api-prod-907565713124.us-central1.run.app
          VITE_TIMESTAMP_SERVICE_MODE: production
          VITE_TIMESTAMP_POLICY_VERSION: paid-beta-v1
          VITE_TIMESTAMP_TERMS_URL: https://coa-sandbox.meteoriteresearch.org/policies/terms.html
          VITE_TIMESTAMP_PRIVACY_URL: https://coa-sandbox.meteoriteresearch.org/policies/privacy.html
          VITE_TIMESTAMP_REFUND_URL: https://coa-sandbox.meteoriteresearch.org/policies/refunds.html
          VITE_TIMESTAMP_SUPPORT_EMAIL: borgesraymond@gmail.com
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
