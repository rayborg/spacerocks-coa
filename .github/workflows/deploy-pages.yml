name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out successful CI revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build production site
        run: npm run build
        env:
          VITE_TIMESTAMP_API_URL: https://timestamp-api-prod-907565713124.us-central1.run.app
          VITE_METBULL_LOOKUP_ENABLED: "true"
          VITE_TIMESTAMP_SERVICE_MODE: production
          VITE_TIMESTAMP_POLICY_VERSION: paid-beta-v1
          VITE_TIMESTAMP_TERMS_URL: https://coa-sandbox.meteoriteresearch.org/policies/terms.html
          VITE_TIMESTAMP_PRIVACY_URL: https://coa-sandbox.meteoriteresearch.org/policies/privacy.html
          VITE_TIMESTAMP_REFUND_URL: https://coa-sandbox.meteoriteresearch.org/policies/refunds.html
          VITE_TIMESTAMP_SUPPORT_EMAIL: borgesraymond@gmail.com
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
