[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spacerocks-timestamp-service"
version = "0.0.1"
description = "Sandbox-only managed timestamp service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.4",
  "email-validator==2.2.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "opentimestamps-client==0.7.2",
  "psycopg[binary]==3.2.13",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.41",
  "stripe==12.3.0",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "jsonschema[format]==4.25.0",
  "mypy==1.17.0",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["stripe.*", "opentimestamps.*"]
ignore_missing_imports = true
